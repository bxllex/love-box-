<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงกิ๊บ 📖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--pink:#FF8FB1;--pink-deep:#E85A8A;--gold:#FFD98E;--cream:#FFF8F3;--ink:#6B4655;--ink-soft:#9C7788}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Mali",system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow:hidden;position:relative;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;padding:22px 16px;
    background:radial-gradient(120% 90% at 15% 0%,#FFE3EF 0%,transparent 55%),radial-gradient(120% 90% at 100% 100%,#EAD9FF 0%,transparent 55%),linear-gradient(160deg,#FFF0F6 0%,#FBEAF6 60%,#F1E6FF 100%)}
  .bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-hearts span{position:absolute;bottom:-40px;font-size:20px;opacity:.45;animation:float linear infinite}
  @keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}100%{transform:translateY(-108vh) rotate(40deg);opacity:0}}
  .mute{position:fixed;top:14px;right:14px;z-index:9;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;color:var(--pink-deep);font-size:1.1rem;box-shadow:0 8px 18px -8px rgba(232,90,138,.6)}

  .book{position:relative;z-index:1;width:100%;max-width:420px;height:min(560px,80vh);perspective:1400px;cursor:pointer}
  .page{position:absolute;inset:0;background:var(--cream);border-radius:26px;border:2px solid #FFE1EC;
    box-shadow:0 26px 60px -26px rgba(232,90,138,.55);padding:34px 28px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .page.active{display:flex;animation:turn .6s cubic-bezier(.3,.9,.3,1) both}
  @keyframes turn{0%{opacity:0;transform:rotateY(-38deg) translateX(20px)}100%{opacity:1;transform:none}}
  .page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,#FFD0E0,#F6C0D6);border-radius:26px 0 0 26px}

  .scene{perspective:900px;margin-bottom:10px;min-height:170px;display:flex;align-items:flex-end;justify-content:center;gap:6px}
  .pop{transform-origin:bottom center;font-size:3.4rem;line-height:1;filter:drop-shadow(0 10px 10px rgba(232,90,138,.25))}
  .page.active .pop{animation:fold .8s cubic-bezier(.2,1.25,.3,1) both}
  .page.active .pop:nth-child(2){animation-delay:.12s}
  .page.active .pop:nth-child(3){animation-delay:.24s}
  .page.active .pop:nth-child(4){animation-delay:.36s}
  @keyframes fold{0%{transform:rotateX(90deg) scale(.5);opacity:0}60%{opacity:1}100%{transform:rotateX(0) scale(1);opacity:1}}
  .pop.big{font-size:6rem}

  .ptext{font-family:"Itim",cursive;font-size:clamp(1.3rem,5.5vw,1.7rem);color:var(--ink);line-height:1.5;margin-top:8px}
  .page.active .ptext{animation:rise .7s ease .35s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .psign{font-family:"Itim",cursive;color:var(--pink-deep);font-size:1rem;margin-top:12px}

  .cover .ico{font-size:4.5rem;margin-bottom:8px}
  .cover h1{font-family:"Itim",cursive;font-size:clamp(1.6rem,6.5vw,2.1rem);color:var(--pink-deep);line-height:1.4}
  .hint{font-family:"Itim",cursive;color:var(--pink-deep);font-size:1.05rem;margin-top:18px;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  .final-actions{display:flex;gap:10px;margin-top:20px}
  .btn{font-family:"Mali",sans-serif;font-weight:600;font-size:.95rem;border:none;cursor:pointer;border-radius:14px;padding:11px 18px;text-decoration:none}
  .btn.primary{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-deep));box-shadow:0 12px 24px -12px rgba(232,90,138,.9)}
  .btn.soft{color:var(--pink-deep);background:#fff;border:2px solid #FFDCE8}

  .nav{position:absolute;bottom:14px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:3}
  .dots{display:flex;gap:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#F3C9DA;transition:transform .2s,background .2s}
  .dots i.on{background:var(--pink-deep);transform:scale(1.35)}
  .arrow{background:none;border:none;color:var(--pink-deep);font-size:1.2rem;cursor:pointer;padding:4px 8px;opacity:.7}
  .arrow[disabled]{opacity:.2;cursor:default}

  .burst{position:fixed;pointer-events:none;z-index:15}
  .burst span{position:absolute;animation:burst 1.1s ease-out forwards}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.2) rotate(var(--r));opacity:0}}
  @media (prefers-reduced-motion:reduce){.bg-hearts span,.hint{animation:none!important}}
</style>
</head>
<body>
<div class="bg-hearts" id="bgHearts"></div>
<button class="mute" id="mute" aria-label="เปิด/ปิดเสียง">🔊</button>

<div class="book" id="book">
  <!-- page 0: cover -->
  <section class="page cover active">
    <div class="ico">📖💗</div>
    <h1>พี่มีอย่างนึง<br>อยากบอกกิ๊บ...</h1>
    <div class="hint">แตะเพื่อเปิด →</div>
  </section>

  <!-- page 1 -->
  <section class="page">
    <div class="scene"><span class="pop">🌸</span><span class="pop">💗</span><span class="pop">✨</span></div>
    <div class="ptext">ตั้งแต่พี่ได้คุยกับกิ๊บ<br>วันธรรมดาๆ ก็พิเศษขึ้นมาเลย 🌸</div>
  </section>

  <!-- page 2 -->
  <section class="page">
    <div class="scene"><span class="pop">🧸</span><span class="pop big">💗</span><span class="pop">🎀</span></div>
    <div class="ptext">ขอบคุณที่เข้ามา<br>ทำให้พี่ยิ้มบ่อยขึ้นกว่าเดิมนะ 🧸💗</div>
  </section>

  <!-- page 3: final -->
  <section class="page">
    <div class="scene"><span class="pop big">💖</span></div>
    <div class="ptext">พี่รักกิ๊บนะ 💕</div>
    <div class="psign">— ด้วยใจจริง</div>
    <div class="final-actions">
      <button class="btn soft" id="restart">อ่านอีกครั้ง</button>
      <a class="btn primary" href="index.html">💌 กล่องคำหวาน</a>
    </div>
  </section>

  <div class="nav">
    <button class="arrow" id="prev" aria-label="ก่อนหน้า">‹</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="ถัดไป">›</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const pages=[...document.querySelectorAll('.page')];
let cur=0, muted=false, audioCtx=null;

/* dots */
const dotsWrap=$('dots');
pages.forEach((_,i)=>{ const d=document.createElement('i'); if(i===0) d.classList.add('on'); dotsWrap.appendChild(d); });

function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freqs,dur=0.25,gap=0.08){ if(muted) return; const ctx=ensureAudio(); if(!ctx) return; const now=ctx.currentTime;
  freqs.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    const t=now+i*gap; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }); }
const chimeTurn=()=>tone([659,880]); const chimeFinal=()=>tone([659,783,987,1318],0.32,0.1);
$('mute').addEventListener('click',e=>{ muted=!muted; e.currentTarget.textContent=muted?'🔇':'🔊'; ensureAudio(); if(!muted) chimeTurn(); });

function hearts(count){ const wrap=document.createElement('div'); wrap.className='burst'; wrap.style.left=(innerWidth/2)+'px'; wrap.style.top=(innerHeight*0.42)+'px';
  const em=['💗','💕','✨','💖','🎀','💫','🩷','⭐','💞']; for(let k=0;k<count;k++){ const s=document.createElement('span'); s.textContent=em[Math.floor(Math.random()*em.length)];
    const a=Math.random()*Math.PI*2,d=100+Math.random()*Math.min(innerWidth,innerHeight)*0.5; s.style.setProperty('--tx',Math.cos(a)*d+'px'); s.style.setProperty('--ty',(Math.sin(a)*d-30)+'px');
    s.style.setProperty('--r',(Math.random()*90-45)+'deg'); s.style.fontSize=(20+Math.random()*22)+'px'; wrap.appendChild(s); }
  document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),1150); }

function go(i){ if(i<0||i>=pages.length) return; const forward=i>cur; pages[cur].classList.remove('active'); cur=i; pages[cur].classList.add('active');
  dotsWrap.querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===cur));
  $('prev').disabled=cur===0; $('next').disabled=cur===pages.length-1;
  if(cur===pages.length-1){ chimeFinal(); setTimeout(()=>hearts(46),300); } else chimeTurn(); }

$('book').addEventListener('click',e=>{ if(e.target.closest('.nav')||e.target.closest('.final-actions')) return; ensureAudio(); if(cur<pages.length-1) go(cur+1); });
$('next').addEventListener('click',e=>{ e.stopPropagation(); ensureAudio(); go(cur+1); });
$('prev').addEventListener('click',e=>{ e.stopPropagation(); go(cur-1); });
$('restart').addEventListener('click',e=>{ e.stopPropagation(); go(0); });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
$('prev').disabled=true;

(function(){ const wrap=$('bgHearts'),h=['💗','💕','🎀','✨','🩷']; for(let i=0;i<12;i++){ const s=document.createElement('span'); s.textContent=h[i%h.length];
  s.style.left=Math.random()*100+'%'; s.style.fontSize=(14+Math.random()*16)+'px'; s.style.animationDuration=(9+Math.random()*8)+'s'; s.style.animationDelay=(Math.random()*8)+'s'; wrap.appendChild(s); } })();
</script>
</body>
</html>
