<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงกิ๊บ 📖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#F0CE86;--gold-deep:#C79A4E;--rose:#E85A8A;--rose-deep:#C7416E;--cream:#FFF7EE;--ink:#5A3A50;--ink-soft:#8A6478}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Mali",system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow:hidden;position:relative;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;padding:20px 14px;
    background:radial-gradient(130% 100% at 50% -10%,#6A3358 0%,#4A2545 45%,#2E1830 100%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 45%,rgba(240,206,134,.16),transparent 70%)}

  .ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .ambient .p{position:absolute;will-change:transform,opacity}
  .petal{bottom:-30px;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-112vh) translateX(40px) rotate(300deg);opacity:0}}
  .spark{border-radius:50%;background:radial-gradient(circle,#FFF3D6,#F0CE86);animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.95;transform:scale(1.1)}}

  .mute{position:fixed;top:14px;right:14px;z-index:9;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,247,238,.9);color:var(--rose-deep);font-size:1.1rem;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}

  .book{position:relative;z-index:1;width:100%;max-width:420px;height:min(580px,82vh);perspective:1600px;cursor:pointer}
  .book::before{content:"";position:absolute;inset:-14px;border-radius:30px;
    background:radial-gradient(60% 60% at 50% 40%,rgba(240,206,134,.35),transparent 72%);filter:blur(8px);z-index:-1}

  .page{position:absolute;inset:0;border-radius:24px;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;overflow:hidden;transform-origin:left center;backface-visibility:hidden}
  .page.active{display:flex;animation:flipIn .75s cubic-bezier(.2,.7,.2,1) both}
  @keyframes flipIn{0%{opacity:0;transform:rotateY(-95deg)}55%{opacity:1}100%{opacity:1;transform:rotateY(0)}}
  .page.leaving{display:flex!important;animation:flipOut .55s ease-in both;z-index:5}
  @keyframes flipOut{0%{transform:rotateY(0);opacity:1}100%{transform:rotateY(78deg);opacity:0}}

  /* inner cream pages with gold frame */
  .paper{background:linear-gradient(160deg,#FFFBF4,#FBEFE0);border:1px solid var(--gold)}
  .paper::before{content:"";position:absolute;inset:10px;border:2px solid var(--gold);border-radius:16px;
    box-shadow:inset 0 0 24px rgba(199,154,78,.18);pointer-events:none}
  .paper .corner{position:absolute;font-size:1.3rem;color:var(--gold-deep);opacity:.85}
  .corner.tl{top:16px;left:18px}.corner.tr{top:16px;right:18px}.corner.bl{bottom:16px;left:18px}.corner.br{bottom:16px;right:18px}
  .spine{position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(90deg,rgba(120,70,40,.28),transparent);z-index:2}

  /* cover */
  .cover{background:linear-gradient(150deg,#B03A6E 0%,#7E2A55 60%,#5E2044 100%);color:#fff}
  .cover .frame{position:absolute;inset:14px;border:2px solid var(--gold);border-radius:16px}
  .cover .frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(240,206,134,.55);border-radius:12px}
  .cover .seal{font-size:4.4rem;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .cover h1{font-family:"Itim",cursive;font-size:clamp(1.6rem,6.6vw,2.15rem);line-height:1.45;margin-top:10px;
    background:linear-gradient(180deg,#FFF6E2,#F0CE86 60%,#D9B268);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 10px rgba(0,0,0,.25)}
  .cover .flourish{color:var(--gold);letter-spacing:.4em;font-size:1rem;margin:6px 0 2px;opacity:.9}
  .ribbon{position:absolute;top:-2px;right:44px;width:26px;height:96px;background:linear-gradient(180deg,#E85A8A,#C7416E);z-index:3;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 6px 14px -4px rgba(0,0,0,.4)}
  .hint{font-family:"Itim",cursive;color:var(--gold);font-size:1.05rem;margin-top:20px;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  .shimmer{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);
    transform:translateX(-100%);animation:sh 4.5s ease-in-out infinite 1s;pointer-events:none}
  @keyframes sh{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}

  /* pop-up scene */
  .scene{position:relative;width:100%;height:230px;perspective:800px;margin-top:6px}
  .layer{position:absolute;bottom:26px;transform-origin:bottom center;transition:transform .1s linear}
  .layer .fold{transform-origin:bottom center;display:inline-block}
  .page.active .layer .fold{animation:fold .85s cubic-bezier(.2,1.3,.3,1) both}
  .layer:nth-child(1) .fold{animation-delay:.15s}
  .layer:nth-child(2) .fold{animation-delay:.28s}
  .layer:nth-child(3) .fold{animation-delay:.41s}
  .layer:nth-child(4) .fold{animation-delay:.54s}
  .layer:nth-child(5) .fold{animation-delay:.67s}
  @keyframes fold{0%{transform:rotateX(92deg) scale(.5);opacity:0}60%{opacity:1}100%{transform:rotateX(0) scale(1);opacity:1}}
  .layer svg{display:block;filter:drop-shadow(0 12px 10px rgba(120,50,80,.28))}

  .banner{position:relative;margin-top:6px;display:inline-block;padding:12px 26px;color:#fff;font-family:"Itim",cursive;
    font-size:clamp(1.15rem,4.6vw,1.45rem);line-height:1.5;background:linear-gradient(160deg,var(--rose),var(--rose-deep));
    border-radius:6px;box-shadow:0 10px 22px -10px rgba(199,65,110,.8)}
  .banner::before,.banner::after{content:"";position:absolute;top:0;width:16px;height:100%;background:var(--rose-deep)}
  .banner::before{left:-14px;clip-path:polygon(100% 0,100% 100%,0 50%)}
  .banner::after{right:-14px;clip-path:polygon(0 0,0 100%,100% 50%)}
  .today-head{font-family:"Itim",cursive;color:var(--gold-deep);letter-spacing:.15em;font-size:1.05rem;margin-bottom:2px}
  .today-date{font-family:"Mali",sans-serif;color:var(--ink-soft);font-size:.9rem;margin:4px 0 6px}
  .page.active .banner{animation:rise2 .7s ease .55s both}
  @keyframes rise2{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}

  /* finale */
  .rays{position:absolute;top:44%;left:50%;width:640px;height:640px;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(240,206,134,0) 0 7deg,rgba(240,206,134,.34) 7deg 14deg);
    -webkit-mask:radial-gradient(closest-side,#000 22%,transparent 70%);mask:radial-gradient(closest-side,#000 22%,transparent 70%);
    animation:spin 20s linear infinite;pointer-events:none}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .glow{position:absolute;top:44%;left:50%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,220,150,.5),transparent 62%);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .bigheart{position:relative;z-index:2}
  .page.active .bigheart{animation:bloom 1s cubic-bezier(.2,1.5,.35,1) .1s both}
  @keyframes bloom{0%{transform:scale(0) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  .ftext{position:relative;z-index:2;font-family:"Itim",cursive;font-size:clamp(1.5rem,6vw,2rem);color:var(--rose-deep);margin-top:6px}
  .page.active .ftext{animation:rise2 .7s ease .5s both}
  .fsign{position:relative;z-index:2;font-family:"Itim",cursive;color:var(--gold-deep);font-size:1.05rem;margin-top:8px}
  .page.active .fsign{animation:rise2 .7s ease .7s both}

  .final-actions{position:relative;z-index:3;display:flex;gap:10px;margin-top:22px}
  .btn{font-family:"Mali",sans-serif;font-weight:600;font-size:.95rem;border:none;cursor:pointer;border-radius:14px;padding:11px 18px;text-decoration:none}
  .btn.primary{color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-deep));box-shadow:0 12px 24px -12px rgba(199,65,110,.9)}
  .btn.soft{color:var(--rose-deep);background:#fff;border:2px solid #F3D3E0}

  .nav{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:6}
  .dots{display:flex;gap:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:rgba(240,206,134,.4);transition:transform .2s,background .2s}
  .dots i.on{background:var(--gold);transform:scale(1.4)}
  .arrow{background:none;border:none;color:var(--gold);font-size:1.3rem;cursor:pointer;padding:4px 8px;opacity:.75}
  .arrow[disabled]{opacity:.18;cursor:default}

  .burst{position:fixed;pointer-events:none;z-index:15}
  .burst span{position:absolute;animation:burst 1.2s ease-out forwards}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.2) rotate(var(--r));opacity:0}}
  .confetti{position:fixed;top:-24px;z-index:14;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{0%{opacity:0}10%{opacity:1}100%{transform:translateY(112vh) rotate(760deg);opacity:.6}}

  @media (prefers-reduced-motion:reduce){.petal,.spark,.shimmer,.rays,.glow,.hint,.seal{animation:none!important}}
  @media (max-width:430px){.scene{height:200px}}
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>
<button class="mute" id="mute" aria-label="เปิด/ปิดเสียง">🔊</button>

<div class="book" id="book">
  <!-- cover -->
  <section class="page cover active">
    <div class="frame"></div><div class="ribbon"></div><div class="shimmer"></div>
    <div class="flourish">✦ ✦ ✦</div>
    <div class="seal">💗</div>
    <h1>พี่มีอย่างนึง<br>อยากบอกกิ๊บ...</h1>
    <div class="flourish" style="margin-top:8px">✦ ✦ ✦</div>
    <div class="hint">แตะเพื่อเปิด →</div>
  </section>

  <!-- page 1: garden -->
  <section class="page paper">
    <span class="corner tl">❧</span><span class="corner tr">❧</span><span class="corner bl">❧</span><span class="corner br">❧</span>
    <div class="scene">
      <div class="layer" data-depth="10" style="left:8%"><div class="fold">
        <svg width="70" height="96" viewBox="0 0 70 96"><rect x="32" y="40" width="6" height="52" fill="#4CA06B"/><path d="M35 60 C10 56 6 40 30 46" fill="#5BB57C"/><g><circle cx="35" cy="30" r="22" fill="#FF9E6B"/><circle cx="35" cy="30" r="12" fill="#FFC08A"/><circle cx="35" cy="30" r="5" fill="#E8896B"/></g></svg>
      </div></div>
      <div class="layer" data-depth="26" style="left:34%"><div class="fold">
        <svg width="96" height="120" viewBox="0 0 96 120"><rect x="45" y="52" width="7" height="66" fill="#3E9160"/><path d="M48 78 C82 72 88 52 56 60" fill="#57B078"/><g><circle cx="48" cy="36" r="30" fill="#FF7FA6"/><path d="M48 12 C60 24 60 48 48 60 C36 48 36 24 48 12Z" fill="#FF9EBE"/><circle cx="48" cy="36" r="10" fill="#E85A8A"/></g></svg>
      </div></div>
      <div class="layer" data-depth="16" style="right:8%"><div class="fold">
        <svg width="64" height="90" viewBox="0 0 64 90"><rect x="29" y="38" width="6" height="52" fill="#4CA06B"/><g><circle cx="32" cy="28" r="20" fill="#B490E0"/><circle cx="32" cy="28" r="10" fill="#CBB2ED"/><circle cx="32" cy="28" r="4" fill="#8E6FCB"/></g></svg>
      </div></div>
      <div class="layer" data-depth="40" style="left:50%;bottom:120px;transform:translateX(-50%)"><div class="fold" style="font-size:2rem">✨🌈✨</div></div>
    </div>
    <div class="banner">ตั้งแต่พี่ได้คุยกับกิ๊บ<br>วันธรรมดาๆ ก็พิเศษขึ้นมาเลย 🌸</div>
  </section>

  <!-- page 2: bear + hearts -->
  <section class="page paper">
    <span class="corner tl">❧</span><span class="corner tr">❧</span><span class="corner bl">❧</span><span class="corner br">❧</span>
    <div class="scene">
      <div class="layer" data-depth="14" style="left:12%;bottom:70px"><div class="fold" style="font-size:1.8rem">🎈</div></div>
      <div class="layer" data-depth="14" style="right:14%;bottom:86px"><div class="fold" style="font-size:1.6rem">🎈</div></div>
      <div class="layer" data-depth="30" style="left:50%;transform:translateX(-50%)"><div class="fold">
        <svg width="150" height="140" viewBox="0 0 150 140">
          <circle cx="42" cy="30" r="16" fill="#C98A5B"/><circle cx="108" cy="30" r="16" fill="#C98A5B"/>
          <circle cx="42" cy="30" r="8" fill="#E3B48C"/><circle cx="108" cy="30" r="8" fill="#E3B48C"/>
          <circle cx="75" cy="60" r="46" fill="#D89A6A"/>
          <ellipse cx="75" cy="72" rx="24" ry="20" fill="#F0D2B4"/>
          <circle cx="60" cy="52" r="5" fill="#4A3226"/><circle cx="90" cy="52" r="5" fill="#4A3226"/>
          <ellipse cx="75" cy="66" rx="6" ry="4" fill="#7A4B32"/>
          <path d="M75 128 C40 104 40 84 64 84 C72 84 75 92 75 96 C75 92 78 84 86 84 C110 84 110 104 75 128Z" fill="#E85A8A"/>
        </svg>
      </div></div>
      <div class="layer" data-depth="46" style="left:24%;bottom:120px"><div class="fold" style="font-size:1.6rem">💗</div></div>
      <div class="layer" data-depth="46" style="right:22%;bottom:130px"><div class="fold" style="font-size:1.3rem">💗</div></div>
    </div>
    <div class="banner">ขอบคุณที่เข้ามา<br>ทำให้พี่ยิ้มบ่อยขึ้นกว่าเดิมนะ 🧸💗</div>
  </section>

  <!-- page 3: word of the day (changes daily) -->
  <section class="page paper">
    <span class="corner tl">❧</span><span class="corner tr">❧</span><span class="corner bl">❧</span><span class="corner br">❧</span>
    <div class="today-head">✦ คำของวันนี้ ✦</div>
    <div class="scene" style="height:170px">
      <div class="layer" data-depth="18" style="left:50%;transform:translateX(-50%)"><div class="fold">
        <svg width="120" height="128" viewBox="0 0 120 128"><rect x="14" y="18" width="92" height="96" rx="12" fill="#fff" stroke="#C79A4E" stroke-width="3"/><rect x="14" y="18" width="92" height="26" rx="12" fill="#E85A8A"/><rect x="30" y="8" width="8" height="22" rx="4" fill="#C7416E"/><rect x="82" y="8" width="8" height="22" rx="4" fill="#C7416E"/><text x="60" y="90" font-size="34" text-anchor="middle" fill="#E85A8A">💗</text></svg>
      </div></div>
      <div class="layer" data-depth="34" style="left:20%;bottom:96px"><div class="fold" style="font-size:1.5rem">✨</div></div>
      <div class="layer" data-depth="34" style="right:20%;bottom:104px"><div class="fold" style="font-size:1.3rem">🌸</div></div>
    </div>
    <div class="today-date" id="todayDate"></div>
    <div class="banner" id="todayMsg">กำลังโหลดคำหวานของวันนี้...</div>
  </section>

  <!-- page 4: grand finale -->
  <section class="page paper" id="finalePage">
    <span class="corner tl">❧</span><span class="corner tr">❧</span><span class="corner bl">❧</span><span class="corner br">❧</span>
    <div class="rays"></div><div class="glow"></div>
    <div class="bigheart">
      <svg width="180" height="170" viewBox="0 0 180 170"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FB1"/><stop offset="1" stop-color="#C7416E"/></linearGradient></defs>
      <path d="M90 158 C18 104 18 44 66 44 C82 44 90 60 90 68 C90 60 98 44 114 44 C162 44 162 104 90 158Z" fill="url(#hg)"/>
      <path d="M74 70 C70 62 58 62 58 74 C58 84 74 92 74 92 C74 92 90 84 90 74 C90 62 78 62 74 70Z" fill="rgba(255,255,255,.55)"/></svg>
    </div>
    <div class="ftext">พี่รักกิ๊บนะ 💕</div>
    <div class="fsign">— ด้วยใจจริง</div>
    <div class="final-actions">
      <button class="btn soft" id="restart">อ่านอีกครั้ง</button>
      <a class="btn primary" href="index.html">💌 กล่องคำหวาน</a>
    </div>
  </section>

  <div class="nav">
    <button class="arrow" id="prev" aria-label="ก่อนหน้า">‹</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="ถัดไป">›</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const pages=[...document.querySelectorAll('.page')];
let cur=0, muted=false, audioCtx=null, animating=false;

const dotsWrap=$('dots');
pages.forEach((_,i)=>{ const d=document.createElement('i'); if(i===0) d.classList.add('on'); dotsWrap.appendChild(d); });

/* sound */
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freqs,dur=0.25,gap=0.08,type='sine'){ if(muted) return; const ctx=ensureAudio(); if(!ctx) return; const now=ctx.currentTime;
  freqs.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    const t=now+i*gap; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }); }
const chimeTurn=()=>tone([659,880]); const chimeFinal=()=>tone([523,659,783,1046,1318],0.4,0.1);
$('mute').addEventListener('click',e=>{ muted=!muted; e.currentTarget.textContent=muted?'🔇':'🔊'; ensureAudio(); if(!muted) chimeTurn(); });

/* particles */
function hearts(count){ const wrap=document.createElement('div'); wrap.className='burst'; wrap.style.left=(innerWidth/2)+'px'; wrap.style.top=(innerHeight*0.42)+'px';
  const em=['💗','💕','✨','💖','🎀','💫','🩷','⭐','💞','🌹']; for(let k=0;k<count;k++){ const s=document.createElement('span'); s.textContent=em[Math.floor(Math.random()*em.length)];
    const a=Math.random()*Math.PI*2,d=110+Math.random()*Math.min(innerWidth,innerHeight)*0.55; s.style.setProperty('--tx',Math.cos(a)*d+'px'); s.style.setProperty('--ty',(Math.sin(a)*d-30)+'px');
    s.style.setProperty('--r',(Math.random()*90-45)+'deg'); s.style.fontSize=(20+Math.random()*24)+'px'; wrap.appendChild(s); }
  document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),1250); }
function confetti(n){ const cols=['#FF8FB1','#F0CE86','#B490E0','#6FC6C0','#FF9E6B','#E85A8A']; for(let k=0;k<n;k++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.width=(6+Math.random()*8)+'px'; c.style.height=(9+Math.random()*10)+'px'; c.style.background=cols[k%cols.length];
    c.style.animationDuration=(2.4+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*0.6)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),5200); } }

/* navigation with page-turn */
function go(i){ if(animating||i<0||i>=pages.length||i===cur) return; animating=true;
  const out=pages[cur], forward=i>cur; out.classList.remove('active');
  if(forward){ out.classList.add('leaving'); setTimeout(()=>out.classList.remove('leaving'),560); }
  cur=i; const pg=pages[cur]; pg.classList.add('active');
  dotsWrap.querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===cur));
  $('prev').disabled=cur===0; $('next').disabled=cur===pages.length-1;
  if(cur===pages.length-1){ chimeFinal(); setTimeout(()=>{ hearts(54); confetti(60); },350); } else chimeTurn();
  setTimeout(()=>animating=false,600); }

$('book').addEventListener('click',e=>{ if(e.target.closest('.nav')||e.target.closest('.final-actions')) return; ensureAudio(); if(cur<pages.length-1) go(cur+1); });
$('next').addEventListener('click',e=>{ e.stopPropagation(); ensureAudio(); go(cur+1); });
$('prev').addEventListener('click',e=>{ e.stopPropagation(); go(cur-1); });
$('restart').addEventListener('click',e=>{ e.stopPropagation(); go(0); });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
$('prev').disabled=true;

/* parallax depth */
function parallax(px,py){ const active=pages[cur]; if(!active) return; active.querySelectorAll('.layer').forEach(l=>{ const d=parseFloat(l.dataset.depth||0); const base=l.style.transform&&l.style.transform.includes('translateX(-50%)')?'translateX(-50%) ':''; l.style.transform=base+`translate(${px*d}px,${py*d*0.5}px)`; }); }
window.addEventListener('pointermove',e=>{ const px=(e.clientX/innerWidth-.5)*2, py=(e.clientY/innerHeight-.5)*2; parallax(px*0.5,py*0.5); });
window.addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; parallax(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30))); });

(function(){ const now=new Date();
  const dayNum=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000); // day of year (local)
  $('todayMsg').textContent=DAILY[dayNum%DAILY.length];
  try{ $('todayDate').textContent=now.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ $('todayDate').textContent=''; }
})();

/* ambient petals + sparkles */
(function(){ const a=$('ambient'); const petals=['🌸','🌷','💗','🌹','✿'];
  for(let i=0;i<12;i++){ const s=document.createElement('div'); s.className='p petal'; s.textContent=petals[i%petals.length];
    s.style.left=Math.random()*100+'%'; s.style.fontSize=(14+Math.random()*16)+'px'; s.style.animationDuration=(10+Math.random()*9)+'s'; s.style.animationDelay=(Math.random()*10)+'s'; a.appendChild(s); }
  for(let i=0;i<26;i++){ const s=document.createElement('div'); s.className='p spark'; const sz=3+Math.random()*4; s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.animationDuration=(2+Math.random()*3)+'s'; s.style.animationDelay=(Math.random()*3)+'s'; a.appendChild(s); }
})();
</script>
