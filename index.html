<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กล่องสุ่มคำหวาน 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF8FB1; --pink-deep:#E85A8A; --peach:#FFC9A3; --gold:#FFD98E;
    --violet:#B490E0; --teal:#6FC6C0; --cream:#FFF8F3; --ink:#6B4655; --ink-soft:#9C7788;
    --bg:radial-gradient(120% 90% at 15% 0%,#FFE3EF 0%,transparent 55%),radial-gradient(120% 90% at 100% 100%,#EAD9FF 0%,transparent 55%),linear-gradient(160deg,#FFF0F6 0%,#FBEAF6 60%,#F1E6FF 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Mali",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;overflow-x:hidden;position:relative;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;padding:24px 18px;
    background:var(--bg);
  }
  .bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-hearts span{position:absolute;bottom:-40px;font-size:22px;opacity:.5;animation:float linear infinite}
  @keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}100%{transform:translateY(-108vh) rotate(40deg);opacity:0}}

  .mute{position:fixed;top:14px;right:14px;z-index:9;width:40px;height:40px;border-radius:50%;
    border:none;cursor:pointer;background:#fff;color:var(--pink-deep);font-size:1.1rem;box-shadow:0 8px 18px -8px rgba(232,90,138,.6)}
  .mute:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

  .stage{position:relative;z-index:1;width:100%;max-width:440px;text-align:center}
  .title{font-family:"Itim",cursive;font-size:clamp(1.7rem,7vw,2.3rem);color:var(--pink-deep);
    line-height:1.3;margin-bottom:4px;text-shadow:0 2px 0 #fff, 0 4px 14px rgba(232,90,138,.25)}
  .subtitle{font-size:.95rem;color:var(--ink-soft);margin-bottom:16px}

  .name-row{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:18px}
  .name-row input{font-family:"Mali",sans-serif;font-size:.95rem;line-height:1.7;color:var(--ink);
    border:2px solid #FFDCE8;background:#fff;border-radius:99px;padding:11px 18px 12px;width:min(280px,80%);
    text-align:center;outline:none;transition:border-color .15s ease}
  .name-row input:focus{border-color:var(--pink)}
  .name-row input::placeholder{color:#C9A9B7}
  .page-link{display:inline-block;margin-bottom:16px;font-family:"Mali",sans-serif;font-weight:600;font-size:.9rem;
    color:var(--pink-deep);background:#fff;border:2px solid #FFDCE8;border-radius:99px;padding:9px 18px;text-decoration:none;
    transition:transform .14s ease}
  .page-link:hover{transform:translateY(-2px)}

  /* greeting card maker */
  .cm-box{background:var(--cream);border-radius:24px;border:2px solid #FFE1EC;max-width:380px;width:100%;padding:22px 20px;
    box-shadow:0 24px 60px -20px rgba(90,50,80,.6);max-height:88vh;overflow:auto}
  .cm-box h3{font-family:"Itim",cursive;color:var(--pink-deep);text-align:center;font-size:1.35rem;margin-bottom:12px}
  .cm-box textarea{width:100%;font-family:"Mali",sans-serif;font-size:1rem;color:var(--ink);border:2px solid #FFDCE8;border-radius:14px;
    padding:12px 14px;resize:none;outline:none;background:#fff;line-height:1.6}
  .cm-box textarea:focus{border-color:var(--pink)}
  .cm-stickers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
  .cm-stickers button{font-size:1.3rem;background:#fff;border:2px solid #FFDCE8;border-radius:12px;width:42px;height:42px;cursor:pointer}
  .cm-stickers button.sel{border-color:var(--pink);background:#FFF0F5}
  .cm-preview{background:linear-gradient(160deg,#FFF0F6,#F3E8FF);border:2px solid #FFE1EC;border-radius:18px;padding:22px 18px;
    text-align:center;margin:6px 0 14px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .cm-preview .pe{font-size:2.4rem}
  .cm-preview .pt{font-size:1.1rem;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .cm-preview .pf{font-family:"Itim",cursive;color:var(--pink-deep);font-size:.9rem;margin-top:4px}

  .box-wrap{position:relative;height:210px;display:flex;align-items:center;justify-content:center}
  .gift{cursor:pointer;filter:drop-shadow(0 18px 26px rgba(232,90,138,.35));animation:wiggle 2.2s ease-in-out infinite;transition:transform .25s ease}
  .gift:hover{transform:scale(1.05)}.gift:active{transform:scale(.94)}
  .gift.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(0) rotate(12deg);opacity:0}}
  .tap-hint{position:absolute;bottom:-4px;left:0;right:0;font-family:"Itim",cursive;font-size:1.05rem;color:var(--pink-deep);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  .panel{display:none}.panel.show{display:block;animation:cardIn .5s cubic-bezier(.3,1.35,.5,1) both}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
  .chip{font-family:"Mali",sans-serif;font-weight:500;font-size:.88rem;cursor:pointer;
    border:2px solid #FFDCE8;background:#fff;color:var(--pink-deep);border-radius:99px;padding:7px 13px;transition:transform .12s ease, background .15s ease, color .15s ease}
  .chip:hover{transform:translateY(-2px)}.chip:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  .chip.active{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;border-color:transparent}

  .card{position:relative;background:var(--cream);border-radius:28px;padding:32px 24px 24px;box-shadow:0 22px 50px -22px rgba(232,90,138,.5);border:2px solid #FFE1EC}
  .card.secret{border-color:var(--gold);box-shadow:0 22px 55px -20px rgba(255,184,77,.7)}
  @keyframes cardIn{from{opacity:0;transform:scale(.8) translateY(14px)}to{opacity:1;transform:none}}
  .ribbon-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;
    font-family:"Itim",cursive;font-size:.95rem;padding:5px 18px;border-radius:99px;box-shadow:0 8px 16px -6px rgba(232,90,138,.7);white-space:nowrap;z-index:3}
  .card.secret .ribbon-tag{background:linear-gradient(135deg,#FFC94D,#FF9E2C)}

  .stage-area{position:relative;min-height:4.2em;display:flex;align-items:center;justify-content:center}
  .msg{font-size:1.2rem;line-height:1.6;padding:6px 2px}
  .flipping{animation:flip .52s ease}
  @keyframes flip{0%{transform:perspective(700px) rotateY(0)}50%{transform:perspective(700px) rotateY(90deg)}100%{transform:perspective(700px) rotateY(0)}}
  .scratch-canvas{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);border-radius:18px;touch-action:none;cursor:grab;display:none}
  .scratch-canvas.on{display:block}

  .actions{display:flex;gap:10px;margin-top:18px}.actions.fun{margin-top:10px}
  .btn{flex:1;font-family:"Mali",sans-serif;font-weight:600;font-size:.98rem;border:none;cursor:pointer;border-radius:15px;padding:13px 8px;transition:transform .14s ease;white-space:nowrap}
  .btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
  .btn.primary{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-deep));box-shadow:0 12px 24px -12px rgba(232,90,138,.9)}
  .btn.soft{color:var(--pink-deep);background:#fff;border:2px solid #FFDCE8}
  .btn.fun{font-size:.9rem;color:var(--pink-deep);background:#fff;border:2px solid #FFDCE8;padding:11px 6px}

  .mini-heart{margin:15px auto 2px;display:block;background:none;border:none;cursor:pointer;font-size:1.5rem;animation:beat 1.4s ease-in-out infinite;line-height:1;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .mini-heart.holding{animation:none;transform:scale(1.8);transition:transform 1.05s linear;filter:drop-shadow(0 0 12px rgba(255,140,185,.95))}
  .mini-heart:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:50%}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .hint-tiny{font-size:.72rem;color:#C9A9B7;margin-top:2px}

  .overlay{position:fixed;inset:0;z-index:20;background:rgba(90,50,80,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px}
  .overlay.on{display:flex;animation:fadeIn .25s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .wheel-box{text-align:center;max-width:340px;width:100%}
  .wheel-title{font-family:"Itim",cursive;color:#fff;font-size:1.4rem;margin-bottom:14px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
  .wheel-wrap{position:relative;width:260px;height:260px;margin:0 auto 18px}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  .wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 14px 34px -10px rgba(0,0,0,.4);
    background:conic-gradient(var(--pink) 0 45deg,var(--violet) 45deg 90deg,var(--teal) 90deg 135deg,var(--gold) 135deg 180deg,var(--pink) 180deg 225deg,var(--violet) 225deg 270deg,var(--teal) 270deg 315deg,var(--gold) 315deg 360deg);
    transition:transform 3.4s cubic-bezier(.15,.9,.25,1)}
  .wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;color:#fff;font-size:.8rem;margin-bottom:16px}
  .legend span{display:flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .wheel-actions{display:flex;gap:10px}

  .burst{position:fixed;pointer-events:none;z-index:15}
  .burst span{position:absolute;animation:burst .95s ease-out forwards}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.15) rotate(var(--r));opacity:0}}
  .rise{position:fixed;pointer-events:none;z-index:16;font-size:20px;animation:rise .8s ease-out forwards}
  @keyframes rise{0%{transform:translateY(0) scale(.7);opacity:1}100%{transform:translateY(-70px) scale(1.1);opacity:0}}

  @media (prefers-reduced-motion:reduce){.gift,.tap-hint,.bg-hearts span,.mini-heart{animation:none!important}}
  @media (max-width:420px){.card{padding:28px 18px 20px}.msg{font-size:1.1rem}}
</style>
</head>
<body>
<div class="bg-hearts" id="bgHearts"></div>
<button class="mute" id="themeBtn" aria-label="เปลี่ยนธีม" style="right:auto;left:14px">🌸</button>
<button class="mute" id="mute" aria-label="เปิด/ปิดเสียง">🔊</button>

<div class="stage">
  <div class="title" id="title">กล่องสุ่มคำหวาน 💌</div>
  <div class="subtitle" id="subtitle">แตะกล่องเพื่อเปิดความหวานของวันนี้~</div>
  <div class="name-row">
    <input id="name" type="text" maxlength="20" value="กิ๊บ" placeholder="ใส่ชื่อเขา (ไม่ใส่ก็ได้)" aria-label="ชื่อเขา">
  </div>
  <a class="page-link" href="game.html">🎮 ไปเล่นเกมรัก →</a>
  <button class="page-link" id="cardMakerBtn" style="cursor:pointer">💌 เขียนการ์ดถึงกิ๊บ</button>

  <div class="box-wrap" id="boxWrap">
    <div class="gift" id="gift" role="button" tabindex="0" aria-label="เปิดกล่อง">
      <svg width="170" height="170" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="78" width="120" height="80" rx="12" fill="url(#bodyG)"/>
        <rect x="22" y="58" width="136" height="34" rx="12" fill="url(#lidG)"/>
        <rect x="80" y="58" width="20" height="100" fill="url(#ribG)"/>
        <path d="M90 58 C 70 34, 44 40, 52 58 C 58 70, 80 62, 90 58 Z" fill="#FFD98E"/>
        <path d="M90 58 C 110 34, 136 40, 128 58 C 122 70, 100 62, 90 58 Z" fill="#FFCB6E"/>
        <circle cx="90" cy="57" r="9" fill="#FFB84D"/>
        <defs>
          <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9EBE"/><stop offset="1" stop-color="#F97AA6"/></linearGradient>
          <linearGradient id="lidG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC2D6"/><stop offset="1" stop-color="#FF9EBE"/></linearGradient>
          <linearGradient id="ribG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#FFCB6E"/></linearGradient>
        </defs>
      </svg>
    </div>
    <div class="tap-hint" id="tapHint">แตะเลย 🎀</div>
  </div>

  <div class="panel" id="panel">
    <div class="chips" id="chips">
      <button class="chip active" data-cat="sweet">💗 คำหวาน</button>
      <button class="chip" data-cat="fortune">🔮 คำทำนาย</button>
      <button class="chip" data-cat="question">💬 ชวนคุย</button>
      <button class="chip" data-cat="coupon">🎟️ คูปองรัก</button>
    </div>
    <div class="card" id="card">
      <div class="ribbon-tag" id="tag">💌 ข้อความจากใจ</div>
      <div class="stage-area" id="stageArea">
        <p class="msg" id="msg"></p>
        <canvas id="scratch" class="scratch-canvas"></canvas>
      </div>
      <div class="actions">
        <button class="btn primary" id="again">สุ่มอีกครั้ง 🎁</button>
        <button class="btn soft" id="copy">คัดลอก 💌</button>
      </div>
      <div class="actions fun">
        <button class="btn fun" id="spinBtn">🎡 วงล้อ</button>
        <button class="btn fun" id="scratchBtn">🪙 ขูดการ์ด</button>
        <button class="btn fun" id="shakeBtn">📳 เขย่า</button>
      </div>
      <button class="mini-heart" id="miniHeart" aria-label="กดหัวใจค้างไว้">🤍</button>
      <div class="hint-tiny">กดหัวใจ<b>ค้างไว้</b>สิ~ (มีอะไรซ่อนอยู่นะ 🤫)</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="wheel-box">
    <div class="wheel-title">🎡 หมุนวงล้อเสี่ยงทาย~</div>
    <div class="wheel-wrap">
      <div class="pointer"></div><div class="wheel" id="wheel"></div><div class="wheel-hub">💗</div>
    </div>
    <div class="legend">
      <span><i style="background:var(--pink)"></i>คำหวาน</span>
      <span><i style="background:var(--violet)"></i>คำทำนาย</span>
      <span><i style="background:var(--teal)"></i>ชวนคุย</span>
      <span><i style="background:var(--gold)"></i>คูปอง</span>
    </div>
    <div class="wheel-actions">
      <button class="btn primary" id="doSpin">หมุน! 🎯</button>
      <button class="btn soft" id="closeWheel">ปิด</button>
    </div>
  </div>
</div>

<!-- greeting card maker -->
<div class="overlay" id="cardOverlay">
  <div class="cm-box">
    <h3>💌 เขียนการ์ดถึงกิ๊บ</h3>
    <div class="cm-preview" id="cmPreview"><div class="pe" id="cmPe">💗</div><div class="pt" id="cmPt">พิมพ์ข้อความของเธอด้านล่างเลย~</div><div class="pf" id="cmPf">— ด้วยรักจากเรา</div></div>
    <div class="cm-stickers" id="cmStickers"></div>
    <textarea id="cmInput" rows="3" maxlength="200" placeholder="เขียนข้อความน่ารักๆ ถึงกิ๊บ..."></textarea>
    <div class="actions" style="margin-top:14px">
      <button class="btn primary" id="cmCopy">คัดลอกส่งให้กิ๊บ 💌</button>
      <button class="btn ghost" id="cmClose">ปิด</button>
    </div>
  </div>
</div>

<script>
const DATA = {
  sweet: { tag:["💌 ข้อความจากใจ","💗 สุ่มความหวาน"], items:[
    "คิดถึง{n}เป็นระยะๆ ตลอดทั้งวันเลยนะ 🥺","{n}คือ notification เดียวที่เรารอทั้งวัน 💗",
    "แค่เห็นชื่อ{n}เด้งขึ้นมา ก็ยิ้มคนเดียวแล้ว 😊","วันนี้เหนื่อยไหม{n}? มาคุยกับเราเดี๋ยวหายเหนื่อยเอง 🫶",
    "ถ้า{n}คิดถึงกันให้กดหัวใจ... เรากดไปแล้วเป็นร้อยที 💘","อยากเป็นเหตุผลที่{n}ยิ้มก่อนนอนทุกคืนเลย 🌙",
    "เก็บ{n}ไว้ในใจแล้วนะ ห้ามหนีไปไหน 🔒💕","แอบเผลอยิ้มทุกทีที่{n}พิมพ์มา รู้ตัวรึเปล่า 😳",
    "{n}ทำให้วันธรรมดาๆ กลายเป็นวันพิเศษได้เก่งจัง 💫","อยากส่งกอดผ่านหน้าจอให้{n}จัง ทำไงดี 🤗",
    "{n}คือแจ้งเตือนที่เราไม่เคยอยากปิดเสียงเลย 🔔💗","เลิกน่ารักได้แล้ว{n} เดี๋ยวเราหลงมากกว่านี้ 🥹",
    "ทุกครั้งที่{n}หัวเราะ เหมือนวันนั้นสดใสขึ้นมาเลย 😄","อยากเป็นคนที่{n}นึกถึงเป็นคนแรกตอนมีเรื่องดีๆ 🌈",
    "แค่ได้คุยกับ{n}วันนี้ ก็ถือว่าเป็นวันที่ดีแล้ว 🥰","{n}รู้ไหม รอยยิ้มของ{n}มีผลกับหัวใจเรามากเลยนะ 💗",
    "ถ้าเหนื่อยเมื่อไหร่ พิงเราได้นะ ไม่ต้องเก่งตลอดก็ได้ 🫂","ส่งพลังบวกให้{n}ผ่านข้อความนี้ รับไปเยอะๆ เลยนะ ✨",
    "วันนี้{n}ทำดีที่สุดแล้ว ภูมิใจใน{n}นะ 👏💕","อยู่ห่างกันแค่ไหน ความคิดถึงก็ส่งถึง{n}ได้เสมอ 🌍💗",
    "{n}เป็นคนพิเศษของเราไปแล้ว รู้ตัวไหมเนี่ย 🥹","อยากกอด{n}แน่นๆ สักที ถ้าเจอกันเมื่อไหร่จองไว้ก่อนนะ 🤗",
    "ขอบคุณที่เข้ามาในวันของเรานะ{n} ทำให้ทุกอย่างดีขึ้นเลย 🌷","หลับฝันดีนะ{n} คืนนี้เราจะฝันดีเพราะได้คุยกับ{n} 🌙💤",
    "อยากให้{n}รู้ว่า มีคนคอยเป็นกำลังใจอยู่ตรงนี้เสมอ 💪💗",

function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freqs,dur=0.25,gap=0.08){ if(muted) return; const ctx=ensureAudio(); if(!ctx) return; const now=ctx.currentTime;
  freqs.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    const t=now+i*gap; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }); }
const chimeOpen=()=>tone([783.99,987.77,1174.66]);
const chimeBlip=()=>tone([1046.5],0.14);

function hearts(count,full){ const wrap=document.createElement('div'); wrap.className='burst'; let ox,oy,maxD;
  if(full){ ox=innerWidth/2; oy=innerHeight/2; maxD=Math.min(innerWidth,innerHeight)*0.62; }
  else{ const r=card.getBoundingClientRect(); ox=r.left+r.width/2; oy=r.top+r.height/2; maxD=170; }
  wrap.style.left=ox+'px'; wrap.style.top=oy+'px'; const em=['💗','💕','✨','💖','🎀','💫','🩷','⭐','💞'];
  for(let k=0;k<count;k++){ const s=document.createElement('span'); s.textContent=em[Math.floor(Math.random()*em.length)];
    const a=Math.random()*Math.PI*2, d=maxD*(0.4+Math.random()*0.6);
    s.style.setProperty('--tx',Math.cos(a)*d+'px'); s.style.setProperty('--ty',(Math.sin(a)*d-30)+'px');
    s.style.setProperty('--r',(Math.random()*90-45)+'deg'); s.style.fontSize=(18+Math.random()*(full?22:16))+'px'; wrap.appendChild(s); }
  document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),1000); }

const canvas=$('scratch'); const ctx=canvas.getContext('2d'); let scratching=false, scratchOn=false, moveCount=0;
$('scratchBtn').addEventListener('click',startScratch);
function startScratch(){ hideScratch();
  const d=DATA[curCat]; const text=apply(pickFrom(curCat,d.items));
  setContent(text, d.tag[Math.floor(Math.random()*d.tag.length)], false);
  const w=stageArea.clientWidth+12, h=stageArea.clientHeight+12; const dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#FFB3CD'); g.addColorStop(1,'#C9A8E8');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='600 16px Mali, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ขูดตรงนี้เลย 🪙✨', w/2, h/2);
  canvas.classList.add('on'); scratchOn=true; moveCount=0; chimeBlip(); }
function hideScratch(){ if(scratchOn){ canvas.classList.remove('on'); scratchOn=false; } }
function scratchAt(e){ if(!scratchOn) return; const r=canvas.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
  if(++moveCount%10===0 && clearedRatio()>0.55) finishScratch(); }
function clearedRatio(){ try{ const img=ctx.getImageData(0,0,canvas.width,canvas.height).data; let clr=0,tot=0;
  for(let i=3;i<img.length;i+=160){ tot++; if(img[i]===0) clr++; } return clr/tot; }catch(e){ return 0; } }
function finishScratch(){ hideScratch(); hearts(30,true); chimeMagic(); }
canvas.addEventListener('pointerdown',e=>{ scratching=true; scratchAt(e); });
canvas.addEventListener('pointermove',e=>{ if(scratching) scratchAt(e); });
canvas.addEventListener('pointerup',()=>scratching=false);
canvas.addEventListener('pointerleave',()=>scratching=false);

const shakeBtn=$('shakeBtn'); let shakeOn=false, lastShake=0;
function onMotion(e){ const a=e.accelerationIncludingGravity||e.acceleration; if(!a) return;
  const mag=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0); const now=Date.now();
  if(mag>28 && now-lastShake>1200){ lastShake=now; reveal(false); } }
shakeBtn.addEventListener('click',()=>{ if(shakeOn) return;
  if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(s=>{ if(s==='granted'){ window.addEventListener('devicemotion',onMotion); shakeOn=true; shakeBtn.textContent='📳 เขย่าได้แล้ว'; } }).catch(()=>{ shakeBtn.textContent='📳 ใช้ไม่ได้'; });
  } else { window.addEventListener('devicemotion',onMotion); shakeOn=true; shakeBtn.textContent='📳 เขย่าได้แล้ว'; } });

$('cmClose').addEventListener('click',()=>$('cardOverlay').classList.remove('on'));
$('cardOverlay').addEventListener('click',e=>{ if(e.target===$('cardOverlay')) $('cardOverlay').classList.remove('on'); });
$('cmCopy').addEventListener('click',e=>{ const v=$('cmInput').value.trim(); if(!v){ $('cmInput').focus(); return; }
  const text=cmSticker+' '+v+'\n— ถึง '+nm()+' ด้วยรักจากเรา';
  navigator.clipboard?.writeText(text).then(()=>{ const b=e.target,t=b.textContent; b.textContent='คัดลอกแล้ว ✓'; setTimeout(()=>b.textContent=t,1600); }).catch(()=>e.target.textContent='คัดลอกไม่ได้ 🥲'); });

(function(){ const wrap=$('bgHearts'),h=['💗','💕','🎀','✨','🩷']; for(let i=0;i<14;i++){ const s=document.createElement('span'); s.textContent=h[i%h.length];
  s.style.left=Math.random()*100+'%'; s.style.fontSize=(14+Math.random()*16)+'px'; s.style.animationDuration=(9+Math.random()*8)+'s'; s.style.animationDelay=(Math.random()*8)+'s'; wrap.appendChild(s); } })();
</script>
</body>
